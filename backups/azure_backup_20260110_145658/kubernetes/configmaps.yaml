    namespace: cloudsound
    resourceVersion: "6607"
    uid: fd006f28-a466-478a-a3b0-fa75b6a277b8
- apiVersion: v1
  data:
    config.yaml: |
      auth_enabled: true
      common:
        compactor_address: 'loki-read'
        path_prefix: /var/loki
        replication_factor: 3
        storage:
          s3:
            bucketnames: chunks
            insecure: false
            s3forcepathstyle: false
      limits_config:
        enforce_metric_name: false
        max_cache_freshness_per_query: 10m
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        split_queries_by_interval: 15m
      memberlist:
        join_members:
        - loki-memberlist
      query_range:
        align_queries_with_step: true
      ruler:
        storage:
          s3:
            bucketnames: ruler
            insecure: false
            s3forcepathstyle: false
          type: s3
      runtime_config:
        file: /etc/loki/runtime-config/runtime-config.yaml
      schema_config:
        configs:
        - from: "2022-01-11"
          index:
            period: 24h
            prefix: loki_index_
          object_store: s3
          schema: v12
          store: boltdb-shipper
      server:
        grpc_listen_port: 9095
        http_listen_port: 3100
      storage_config:
        hedging:
          at: 250ms
          max_per_second: 20
          up_to: 3
      table_manager:
        retention_deletes_enabled: false
        retention_period: 0
