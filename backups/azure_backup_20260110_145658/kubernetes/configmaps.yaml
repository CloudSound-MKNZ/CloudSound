  data:
    nginx.conf: "worker_processes  5;  ## Default: 1\nerror_log  /dev/stderr;\npid
      \       /tmp/nginx.pid;\nworker_rlimit_nofile 8192;\n\nevents {\n  worker_connections
      \ 4096;  ## Default: 1024\n}\n\nhttp {\n  client_body_temp_path /tmp/client_temp;\n
      \ proxy_temp_path       /tmp/proxy_temp_path;\n  fastcgi_temp_path     /tmp/fastcgi_temp;\n
      \ uwsgi_temp_path       /tmp/uwsgi_temp;\n  scgi_temp_path        /tmp/scgi_temp;\n\n
      \ client_max_body_size 4M;\n\n  proxy_read_timeout    600; ## 6 minutes\n  proxy_send_timeout
      \   600;\n  proxy_connect_timeout 600;\n\n  proxy_http_version    1.1;\n\n  default_type
      application/octet-stream;\n  log_format   main '$remote_addr - $remote_user
      [$time_local]  $status '\n        '\"$request\" $body_bytes_sent \"$http_referer\"
      '\n        '\"$http_user_agent\" \"$http_x_forwarded_for\"';\n  access_log   /dev/stderr
      \ main;\n\n  sendfile     on;\n  tcp_nopush   on;\n  resolver kube-dns.kube-system.svc.cluster.local.;\n
      \ \n\n  server {\n    listen             8080;\n\n    location = / {\n      return
      200 'OK';\n      auth_basic off;\n    }\n\n    location = /api/prom/push {\n
      \     proxy_pass       http://loki-write.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n\n    location = /api/prom/tail {\n      proxy_pass       http://loki-read.cloudsound.svc.cluster.local:3100$request_uri;\n
      \     proxy_set_header Upgrade $http_upgrade;\n      proxy_set_header Connection
      \"upgrade\";\n    }\n\n    location ~ /api/prom/.* {\n      proxy_pass       http://loki-read.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n\n    location ~ /prometheus/api/v1/alerts.* {\n      proxy_pass       http://loki-read.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n    location ~ /prometheus/api/v1/rules.* {\n      proxy_pass       http://loki-read.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n    location ~ /ruler/.* {\n      proxy_pass       http://loki-read.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n\n    location = /loki/api/v1/push {\n      proxy_pass       http://loki-write.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n\n    location = /loki/api/v1/tail {\n      proxy_pass       http://loki-read.cloudsound.svc.cluster.local:3100$request_uri;\n
      \     proxy_set_header Upgrade $http_upgrade;\n      proxy_set_header Connection
      \"upgrade\";\n    }\n\n    location ~ /compactor/.* {\n      proxy_pass       http://loki-read.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n\n    location ~ /distributor/.* {\n      proxy_pass       http://loki-write.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n\n    location ~ /ring {\n      proxy_pass       http://loki-write.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n\n    location ~ /ingester/.* {\n      proxy_pass       http://loki-write.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n\n    location ~ /store-gateway/.* {\n      proxy_pass       http://loki-read.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n\n    location ~ /query-scheduler/.* {\n      proxy_pass       http://loki-read.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n    location ~ /scheduler/.* {\n      proxy_pass       http://loki-read.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n\n    location ~ /loki/api/.* {\n      proxy_pass       http://loki-read.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n\n    location ~ /admin/api/.* {\n      proxy_pass       http://loki-write.cloudsound.svc.cluster.local:3100$request_uri;\n
      \   }\n  }\n}\n"
