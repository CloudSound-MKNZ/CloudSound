apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: cloudsound
spec:
  template:
    spec:
      containers:
      - name: migration
        image: cloudsound-radio-streaming:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            cd /app/backend/shared/db
            alembic upgrade head
        env:
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "cloudsound"
        - name: POSTGRES_USER
          value: "cloudsound"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: "cloudsound"
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password
        - name: PYTHONPATH
          value: "/app"
      restartPolicy: Never
  backoffLimit: 3

