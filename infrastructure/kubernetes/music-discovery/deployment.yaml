apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-discovery
  namespace: cloudsound
  labels:
    app: music-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: music-discovery
  template:
    metadata:
      labels:
        app: music-discovery
    spec:
      containers:
      - name: music-discovery
        image: cloudsound-music-discovery:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8003
          name: http
        env:
        - name: ENVIRONMENT
          value: "development"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "cloudsound"
        - name: POSTGRES_USER
          value: "cloudsound"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: "cloudsound"
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password
        - name: MINIO_ENDPOINT
          value: "minio:9000"
        - name: MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: MINIO_SECRET_KEY
          value: "minioadmin"
        - name: MINIO_BUCKET
          value: "cloudsound-music"
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOG_FORMAT
          value: "json"
        - name: USE_MOCK_APIS
          value: "true"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: download-temp
          mountPath: /tmp/cloudsound-downloads
      volumes:
      - name: download-temp
        emptyDir:
          sizeLimit: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: music-discovery
  namespace: cloudsound
spec:
  selector:
    app: music-discovery
  ports:
  - port: 8003
    targetPort: 8003
    name: http
  type: ClusterIP

