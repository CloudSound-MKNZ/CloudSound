apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: cloudsound
data:
  cloudsound-alerts.yml: |
    groups:
      - name: cloudsound-service-alerts
        rules:
          # Service down alerts
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "{{ $labels.job }} has been down for more than 1 minute."

          # High error rate
          - alert: HighErrorRate
            expr: |
              sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
              /
              sum(rate(http_requests_total[5m])) by (job)
              > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate on {{ $labels.job }}"
              description: "{{ $labels.job }} has error rate above 5% for 5 minutes."

          # High latency
          - alert: HighLatency
            expr: |
              histogram_quantile(0.95, 
                sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le)
              ) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High latency on {{ $labels.job }}"
              description: "P95 latency on {{ $labels.job }} is above 1 second."

      - name: cloudsound-api-gateway-alerts
        rules:
          # API Gateway rate limiting
          - alert: HighRateLimitHits
            expr: |
              sum(rate(api_gateway_rate_limit_hits_total[5m])) > 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High rate limit hits on API Gateway"
              description: "More than 10 rate limit hits per second on API Gateway."

          # API Gateway proxy errors
          - alert: ProxyErrors
            expr: |
              sum(rate(api_gateway_proxy_requests_total{status=~"5.."}[5m])) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Proxy errors on API Gateway"
              description: "API Gateway experiencing backend service errors."

      - name: cloudsound-music-discovery-alerts
        rules:
          # Download failures
          - alert: HighDownloadFailureRate
            expr: |
              sum(rate(music_discovery_downloads_total{status="failed"}[5m]))
              /
              sum(rate(music_discovery_downloads_total[5m]))
              > 0.2
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High download failure rate"
              description: "Music discovery download failure rate above 20%."

          # Storage quota warning
          - alert: StorageQuotaWarning
            expr: music_discovery_storage_usage_percent > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Storage quota warning"
              description: "Music discovery storage usage above 80%."

          # Storage quota critical
          - alert: StorageQuotaCritical
            expr: music_discovery_storage_usage_percent > 95
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Storage quota critical"
              description: "Music discovery storage usage above 95%."

          # Circuit breaker open
          - alert: CircuitBreakerOpen
            expr: music_discovery_circuit_breaker_state == 2
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Circuit breaker open for {{ $labels.name }}"
              description: "External API circuit breaker is open."

      - name: cloudsound-radio-streaming-alerts
        rules:
          # Streaming errors
          - alert: StreamingErrors
            expr: |
              sum(rate(radio_streaming_errors_total[5m])) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Radio streaming errors"
              description: "Radio streaming service experiencing errors."

      - name: cloudsound-infrastructure-alerts
        rules:
          # Kafka consumer lag
          - alert: KafkaConsumerLag
            expr: kafka_consumer_lag > 1000
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High Kafka consumer lag"
              description: "Kafka consumer lag is above 1000 messages."

          # PostgreSQL connections
          - alert: HighPostgresConnections
            expr: pg_stat_activity_count > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High PostgreSQL connections"
              description: "PostgreSQL connection count above 80."

          # RabbitMQ queue depth
          - alert: HighQueueDepth
            expr: rabbitmq_queue_messages > 1000
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High RabbitMQ queue depth"
              description: "RabbitMQ queue has more than 1000 messages."

