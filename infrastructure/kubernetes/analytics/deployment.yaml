apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: cloudsound
  labels:
    app: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
      - name: analytics
        image: cloudsound-analytics:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8007
          name: http
        env:
        - name: ENVIRONMENT
          value: "development"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "cloudsound"
        - name: POSTGRES_USER
          value: "cloudsound"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOG_FORMAT
          value: "json"
        livenessProbe:
          httpGet:
            path: /health
            port: 8007
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8007
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: cloudsound
spec:
  selector:
    app: analytics
  ports:
  - port: 8007
    targetPort: 8007
    name: http
  type: ClusterIP

