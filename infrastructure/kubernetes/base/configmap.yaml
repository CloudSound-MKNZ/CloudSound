apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudsound-config
  namespace: cloudsound
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "cloudsound"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "cloudsound-music"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

