---
# CloudSound Main Ingress
# This configures external access to CloudSound services
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudsound-ingress
  namespace: cloudsound
  annotations:
    # Ingress class
    kubernetes.io/ingress.class: nginx
    
    # cert-manager
    cert-manager.io/cluster-issuer: letsencrypt-prod
    
    # Nginx configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    
    # Request size limits
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    
    # Rate limiting (optional)
    # nginx.ingress.kubernetes.io/limit-rps: "100"
    
spec:
  tls:
  - hosts:
    - api.cloudsound.example.com  # Replace with your domain
    - app.cloudsound.example.com  # Replace with your domain
    secretName: cloudsound-tls
  
  rules:
  # API Gateway (main API endpoint)
  - host: api.cloudsound.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8000
  
  # Frontend (web application)
  - host: app.cloudsound.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000

---
# Monitoring Ingress (Grafana)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudsound-monitoring-ingress
  namespace: cloudsound
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    
    # Basic auth for Grafana (optional)
    # nginx.ingress.kubernetes.io/auth-type: basic
    # nginx.ingress.kubernetes.io/auth-secret: grafana-auth
    # nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  tls:
  - hosts:
    - monitoring.cloudsound.example.com  # Replace with your domain
    secretName: cloudsound-monitoring-tls
  
  rules:
  - host: monitoring.cloudsound.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000

