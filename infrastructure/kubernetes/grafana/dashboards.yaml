apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: cloudsound
data:
  cloudsound-overview.json: |
    {
      "dashboard": {
        "id": null,
        "uid": "cloudsound-overview",
        "title": "CloudSound Overview",
        "tags": ["cloudsound"],
        "timezone": "browser",
        "schemaVersion": 30,
        "refresh": "30s",
        "panels": [
          {
            "id": 1,
            "title": "Service Health",
            "type": "stat",
            "gridPos": {"h": 4, "w": 24, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "sum(up{job=~\"api-gateway|radio-streaming|concert-management|analytics|music-discovery|event-manager\"})",
                "legendFormat": "Services Up"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "justifyMode": "auto",
              "textMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "red", "value": null},
                    {"color": "yellow", "value": 4},
                    {"color": "green", "value": 6}
                  ]
                }
              }
            }
          },
          {
            "id": 2,
            "title": "Request Rate",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "targets": [
              {
                "expr": "sum(rate(http_requests_total[5m])) by (job)",
                "legendFormat": "{{ job }}"
              }
            ],
            "options": {
              "legend": {"displayMode": "table", "placement": "bottom"}
            }
          },
          {
            "id": 3,
            "title": "Error Rate",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{status=~\"5..\"}[5m])) by (job)",
                "legendFormat": "{{ job }}"
              }
            ],
            "options": {
              "legend": {"displayMode": "table", "placement": "bottom"}
            },
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {"fillOpacity": 10}
              }
            }
          },
          {
            "id": 4,
            "title": "P95 Latency",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le))",
                "legendFormat": "{{ job }}"
              }
            ],
            "options": {
              "legend": {"displayMode": "table", "placement": "bottom"}
            },
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              }
            }
          },
          {
            "id": 5,
            "title": "Active Connections",
            "type": "gauge",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
            "targets": [
              {
                "expr": "sum(api_gateway_active_connections)",
                "legendFormat": "Connections"
              }
            ],
            "options": {
              "showThresholdLabels": false,
              "showThresholdMarkers": true
            },
            "fieldConfig": {
              "defaults": {
                "max": 1000,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 500},
                    {"color": "red", "value": 800}
                  ]
                }
              }
            }
          }
        ]
      }
    }

  api-gateway.json: |
    {
      "dashboard": {
        "id": null,
        "uid": "api-gateway",
        "title": "API Gateway",
        "tags": ["cloudsound", "api-gateway"],
        "timezone": "browser",
        "schemaVersion": 30,
        "refresh": "30s",
        "panels": [
          {
            "id": 1,
            "title": "Request Rate by Path",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "sum(rate(api_gateway_requests_total[5m])) by (path)",
                "legendFormat": "{{ path }}"
              }
            ]
          },
          {
            "id": 2,
            "title": "Rate Limit Hits",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "sum(rate(api_gateway_rate_limit_hits_total[5m])) by (client_type)",
                "legendFormat": "{{ client_type }}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Proxy Latency by Service",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(api_gateway_proxy_duration_seconds_bucket[5m])) by (service, le))",
                "legendFormat": "{{ service }}"
              }
            ],
            "fieldConfig": {"defaults": {"unit": "s"}}
          },
          {
            "id": 4,
            "title": "Auth Attempts",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
            "targets": [
              {
                "expr": "sum(rate(api_gateway_auth_attempts_total[5m])) by (status)",
                "legendFormat": "{{ status }}"
              }
            ]
          }
        ]
      }
    }

  music-discovery.json: |
    {
      "dashboard": {
        "id": null,
        "uid": "music-discovery",
        "title": "Music Discovery",
        "tags": ["cloudsound", "music-discovery"],
        "timezone": "browser",
        "schemaVersion": 30,
        "refresh": "30s",
        "panels": [
          {
            "id": 1,
            "title": "Downloads by Status",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "sum(rate(music_discovery_downloads_total[5m])) by (status)",
                "legendFormat": "{{ status }}"
              }
            ]
          },
          {
            "id": 2,
            "title": "Storage Usage",
            "type": "gauge",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "music_discovery_storage_usage_percent",
                "legendFormat": "Usage %"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "max": 100,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 70},
                    {"color": "red", "value": 90}
                  ]
                }
              }
            }
          },
          {
            "id": 3,
            "title": "Circuit Breaker States",
            "type": "stat",
            "gridPos": {"h": 4, "w": 12, "x": 0, "y": 8},
            "targets": [
              {
                "expr": "music_discovery_circuit_breaker_state",
                "legendFormat": "{{ name }}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "mappings": [
                  {"type": "value", "options": {"0": {"text": "CLOSED", "color": "green"}}},
                  {"type": "value", "options": {"1": {"text": "HALF-OPEN", "color": "yellow"}}},
                  {"type": "value", "options": {"2": {"text": "OPEN", "color": "red"}}}
                ]
              }
            }
          },
          {
            "id": 4,
            "title": "API Latency",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(music_discovery_api_latency_seconds_bucket[5m])) by (service, le))",
                "legendFormat": "{{ service }}"
              }
            ],
            "fieldConfig": {"defaults": {"unit": "s"}}
          }
        ]
      }
    }

  radio-streaming.json: |
    {
      "dashboard": {
        "id": null,
        "uid": "radio-streaming",
        "title": "Radio Streaming",
        "tags": ["cloudsound", "radio-streaming"],
        "timezone": "browser",
        "schemaVersion": 30,
        "refresh": "30s",
        "panels": [
          {
            "id": 1,
            "title": "Active Streams",
            "type": "stat",
            "gridPos": {"h": 4, "w": 8, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "sum(radio_streaming_active_streams)",
                "legendFormat": "Active"
              }
            ]
          },
          {
            "id": 2,
            "title": "Playback Events/min",
            "type": "stat",
            "gridPos": {"h": 4, "w": 8, "x": 8, "y": 0},
            "targets": [
              {
                "expr": "sum(rate(kafka_messages_produced_total{topic=\"radio.playback.events\"}[1m])) * 60",
                "legendFormat": "Events"
              }
            ]
          },
          {
            "id": 3,
            "title": "Stream Requests",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=\"radio-streaming\", path=~\"/api/v1/radio/stream.*\"}[5m]))",
                "legendFormat": "Streams"
              }
            ]
          },
          {
            "id": 4,
            "title": "Bytes Streamed",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "targets": [
              {
                "expr": "sum(rate(radio_streaming_bytes_total[5m]))",
                "legendFormat": "Bytes/s"
              }
            ],
            "fieldConfig": {"defaults": {"unit": "binBps"}}
          }
        ]
      }
    }

