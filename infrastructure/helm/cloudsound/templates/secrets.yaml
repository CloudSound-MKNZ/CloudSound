apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "cloudsound.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ .Values.secrets.secretKey | quote }}
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  rabbitmq-password: {{ .Values.rabbitmq.auth.password | quote }}
  minio-secret-key: {{ .Values.minio.auth.rootPassword | quote }}
  {{- if .Values.secrets.facebookAccessToken }}
  facebook-access-token: {{ .Values.secrets.facebookAccessToken | quote }}
  {{- end }}

