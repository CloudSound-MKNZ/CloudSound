---
{{/*
Music Discovery Service
*/}}
{{- if .Values.musicDiscovery.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-music-discovery
  labels:
    {{- include "cloudsound.labels" . | nindent 4 }}
    app: music-discovery
spec:
  replicas: {{ .Values.musicDiscovery.replicaCount }}
  selector:
    matchLabels:
      app: music-discovery
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: music-discovery
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - name: music-discovery
        image: {{ include "cloudsound.image" (dict "global" .Values.global "service" .Values.musicDiscovery) }}
        imagePullPolicy: {{ .Values.musicDiscovery.image.pullPolicy }}
        ports:
        - containerPort: 8003
        env:
        {{- include "cloudsound.commonEnv" . | nindent 8 }}
        - name: USE_MOCK_APIS
          value: "true"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          {{- toYaml .Values.musicDiscovery.resources | nindent 10 }}
        volumeMounts:
        - name: download-temp
          mountPath: /tmp/cloudsound-downloads
      volumes:
      - name: download-temp
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-music-discovery
spec:
  type: {{ .Values.musicDiscovery.service.type }}
  ports:
  - port: {{ .Values.musicDiscovery.service.port }}
    targetPort: 8003
  selector:
    app: music-discovery
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

