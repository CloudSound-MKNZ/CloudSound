{{/*
Radio Streaming Service
*/}}
{{- if .Values.radioStreaming.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-radio-streaming
  labels:
    {{- include "cloudsound.labels" . | nindent 4 }}
    app: radio-streaming
spec:
  replicas: {{ .Values.radioStreaming.replicaCount }}
  selector:
    matchLabels:
      app: radio-streaming
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: radio-streaming
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - name: radio-streaming
        image: {{ include "cloudsound.image" (dict "global" .Values.global "service" .Values.radioStreaming) }}
        imagePullPolicy: {{ .Values.radioStreaming.image.pullPolicy }}
        ports:
        - containerPort: 8004
        env:
        {{- include "cloudsound.commonEnv" . | nindent 8 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.radioStreaming.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-radio-streaming
spec:
  type: {{ .Values.radioStreaming.service.type }}
  ports:
  - port: {{ .Values.radioStreaming.service.port }}
    targetPort: 8004
  selector:
    app: radio-streaming
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

